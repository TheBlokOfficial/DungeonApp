<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">Architektura DungeonApp</title>
  <desc id="description">Diagram pokazuje przepływ od interfejsu Avalonia przez sesję kampanii do rdzenia domenowego i plików JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
    <style>.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:16}.node{fill:#fff;stroke:#475569;stroke-width:2;rx:10}.ui{fill:#eef2ff;stroke:#4f46e5}.core{fill:#ecfdf5;stroke:#059669}.store{fill:#fff7ed;stroke:#ea580c}.label{font:600 20px sans-serif;fill:#172033}.body{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#475569}.edge{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="60" y="55" class="label" style="font-size:30px">DungeonApp — mapa architektury</text>
  <text x="60" y="84" class="body">Zmiana wykonana przez Mistrza Gry przechodzi przez sesję, rdzeń domeny i trwały zapis.</text>
  <rect x="50" y="120" width="355" height="500" class="group"/><text x="75" y="158" class="label">Desktop / Avalonia</text><text x="75" y="183" class="small">Interfejs i stan prezentacji</text>
  <rect x="80" y="215" width="295" height="80" class="node ui"/><text x="105" y="248" class="label">App.axaml.cs</text><text x="105" y="273" class="body">Składa zależności</text>
  <rect x="80" y="335" width="295" height="95" class="node ui"/><text x="105" y="368" class="label">AppShellViewModel</text><text x="105" y="393" class="body">Biblioteka ↔ biurko kampanii</text>
  <rect x="80" y="470" width="295" height="110" class="node ui"/><text x="105" y="503" class="label">Panele i ViewModele</text><text x="105" y="528" class="body">Np. CounterPanelViewModel</text><text x="105" y="553" class="small">Gesty i prezentacja</text>
  <rect x="450" y="120" width="355" height="500" class="group"/><text x="475" y="158" class="label">Core</text><text x="475" y="183" class="small">Bez referencji do Avalonia</text>
  <rect x="480" y="215" width="295" height="90" class="node core"/><text x="505" y="248" class="label">CampaignSession</text><text x="505" y="273" class="body">Wykonuje zmianę, potem zapisuje</text>
  <rect x="480" y="345" width="295" height="110" class="node core"/><text x="505" y="378" class="label">Campaign</text><text x="505" y="403" class="body">CampaignDataBlocks · Events</text><text x="505" y="428" class="small">Stan jednej kampanii</text>
  <rect x="480" y="495" width="295" height="85" class="node core"/><text x="505" y="528" class="label">Narzędzia</text><text x="505" y="553" class="body">CounterTool → transform danych</text>
  <rect x="850" y="120" width="300" height="500" class="group"/><text x="875" y="158" class="label">Trwałość</text><text x="875" y="183" class="small">Dokumenty użytkownika</text>
  <rect x="880" y="265" width="240" height="100" class="node store"/><text x="905" y="298" class="label">Repository JSON</text><text x="905" y="323" class="body">Manifest + data blocki</text><text x="905" y="348" class="small">Wykrywa przerwany zapis</text>
  <rect x="880" y="440" width="240" height="80" class="node store"/><text x="905" y="473" class="label">Pliki kampanii</text><text x="905" y="498" class="body">campaign.json / datablocks</text>
  <path d="M227 295 L227 335" class="edge"/><path d="M227 430 L227 470" class="edge"/><path d="M375 525 C425 525 430 260 480 260" class="edge"/><path d="M627 305 L627 345" class="edge"/><path d="M627 455 L627 495" class="edge dashed"/><path d="M775 260 L880 310" class="edge"/><path d="M1000 365 L1000 440" class="edge"/>
  <text x="807" y="253" class="small">SaveAsync / GetAsync</text><text x="380" y="502" class="small">operacja użytkownika</text>
  <line x1="70" y1="650" x2="110" y2="650" class="edge"/><text x="125" y="656" class="small">główny przepływ</text><line x1="320" y1="650" x2="360" y2="650" class="edge dashed"/><text x="375" y="656" class="small">narzędzie interpretuje własne dane</text>
</svg>
